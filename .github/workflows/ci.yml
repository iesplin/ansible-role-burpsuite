---
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

defaults:
  run:
    working-directory: "iesplin.burp_suite"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v5
        with:
          path: "iesplin.burp_suite"

      - name: Set up Python 3.
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv.
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install test dependencies.
        run: uv sync --locked

      - name: Lint code.
        run: |
          uv run yamllint .
          uv run ansible-lint

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - ubuntu:latest
          - debian:testing
          - debian:stable
          - fedora:latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v5
        with:
          path: "iesplin.burp_suite"

      - name: Set up Python 3.
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv.
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install test dependencies.
        run: uv sync --locked

      - name: Run Molecule tests.
        run: uv run molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}
