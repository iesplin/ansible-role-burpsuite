---
# defaults file for ansible-role-burpsuite

# Automated Burp Suite activation
burpsuite_activate: true

# Burp Suite Pro license key content. Leave empty for Burp Suite Community edition
burpsuite_pro_license_key: ''

# Install from the Early Adopter release channel instead of Stable
burpsuite_early_adopter: false

# Extras directory for jars and activation script. Defaults to a directory under the user's home directory
burpsuite_extras_dir: "{{ _burpsuite_user_home }}/BurpSuiteExtras"

# Path to save the Burp Suite CA public certificate
burpsuite_cacert_path: "{{ burpsuite_extras_dir }}/PortSwigger_CA.der"

# Additional jar files
burpsuite_extras_jars:
  jruby:
    jar: jruby-complete.jar
    url: https://repo1.maven.org/maven2/org/jruby/jruby-complete/10.1.2.0/jruby-complete-10.1.2.0.jar
    checksum: sha256:decb15ddef5eebf596fbd77f10483a23a1b031930d283ada2aafa5841cd0d603
  jython:
    jar: jython-standalone.jar
    url: https://repo1.maven.org/maven2/org/python/jython-standalone/2.7.4/jython-standalone-2.7.4.jar
    checksum: sha256:1fba1769effcc8b19f5e10436bc8274a158ce988559f257927c24c73bb137f3c
