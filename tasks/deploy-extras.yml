---
- name: Create directory for Burp Suite extras
  ansible.builtin.file:
    path: "{{ burpsuite_extras_dir }}"
    state: directory
    mode: '0755'

- name: Download jar files
  ansible.builtin.get_url:
    url: "{{ item.value.url }}"
    dest: "{{ burpsuite_extras_dir }}/{{ item.value.jar }}"
    checksum: "{{ item.value.checksum }}"
    mode: '0640'
  loop: "{{ lookup('dict', burpsuite_extras_jars) }}"

- name: Copy burp_activate.py script to extras directory
  ansible.builtin.copy:
    src: burp_activate.py
    dest: "{{ burpsuite_extras_dir }}/burp_activate.py"
    mode: '0644'
