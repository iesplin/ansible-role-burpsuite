---
# tasks file for ansible-role-burpsuite

- name: Validate variables
  ansible.builtin.import_tasks: validations.yml

- name: Set variables
  ansible.builtin.import_tasks: variables.yml

# Check previous installation
- name: Installed Burp Suite version
  ansible.builtin.import_tasks: installed-version.yml

- name: Lookup latest releases from PortSwigger
  ansible.builtin.include_tasks: lookup-releases.yml

# Install tasks
- name: Install Burp Suite
  ansible.builtin.include_tasks: install.yml
  when: _burpsuite_installed_version != _burpsuite_installer_version

# Burp Suite extras
- name: Deploy extras
  ansible.builtin.import_tasks: deploy-extras.yml

# Activate Burp Suite
- name: Activate Burp Suite
  when: burpsuite_activate | bool
  block:

    - name: Activate Burp Suite and download CA public certificate
      ansible.builtin.command:
        cmd: "python3 burp_activate.py --cacert-path {{ burpsuite_cacert_path | quote }} {{ _burpsuite_install_dir | quote }}"
        chdir: "{{ burpsuite_extras_dir }}"
      environment:
        BURP_LICENSE_KEY: "{{ burpsuite_pro_license_key }}"
      async: 600
      register: _burpsuite_activation
      changed_when: >-
        ('Your license is successfully installed and activated' in _burpsuite_activation.stdout or
        'Certificate downloaded/updated' in _burpsuite_activation.stdout)
      no_log: "{{ burpsuite_pro_license_key | length > 0 }}"

  rescue:

    - name: Show activation output
      ansible.builtin.debug:
        var: _burpsuite_activation.stdout_lines

    - name: Fail on activation error
      ansible.builtin.fail:
        msg: "Burp Suite activation failed (exit code {{ _burpsuite_activation.rc | default('unknown') }}). See output above."

# Create default user config
- name: User config
  ansible.builtin.import_tasks: user-config.yml
