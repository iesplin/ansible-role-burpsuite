---
- name: Warn that burpsuite_release_channel has been removed
  ansible.builtin.debug:
    msg: >-
      WARNING: burpsuite_release_channel has been removed and is ignored.
      Set burpsuite_early_adopter: true for the Early Adopter channel, otherwise Stable is installed.
  when: burpsuite_release_channel is defined

- name: Warn that version and edition variables have been removed
  ansible.builtin.debug:
    msg: >-
      WARNING: burpsuite_version, burpsuite_edition and burpsuite_installer_sha256_checksum have been removed and are ignored.
      The latest release from the selected channel is always installed, and Professional edition is enabled by burpsuite_pro_license_key.
  when: >-
    burpsuite_version is defined or
    burpsuite_edition is defined or
    burpsuite_installer_sha256_checksum is defined

- name: Warn that burpsuite_install_dir has been removed
  ansible.builtin.debug:
    msg: >-
      WARNING: burpsuite_install_dir has been removed and is ignored.
      Burp Suite is always installed to ~/BurpSuite for the user running the role.
  when: burpsuite_install_dir is defined

- name: Removed burpsuite_user variable is not set
  ansible.builtin.assert:
    that:
      - burpsuite_user is not defined
    fail_msg: >-
      burpsuite_user has been removed. Burp Suite is installed for the user running the role.
      Set become: true and become_user on the role to install for another user.
    quiet: true

- name: CPU architecture is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in _burpsuite_platform_enum
    fail_msg: >-
      Unsupported CPU architecture '{{ ansible_facts['architecture'] }}'.
      Supported architectures: {{ _burpsuite_platform_enum | list | join(', ') }}
    quiet: true

- name: Check pexpect is installed
  when: burpsuite_activate | bool
  block:

    - name: Import pexpect
      ansible.builtin.command:
        cmd: python3 -c 'import pexpect'
      register: _burpsuite_pexpect_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Python pexpect library is installed
      ansible.builtin.assert:
        that:
          - _burpsuite_pexpect_check.rc == 0
        fail_msg: >-
          The Python pexpect library is required for Burp Suite activation.
          Install it before running this role (e.g. the python3-pexpect package), or set burpsuite_activate: false.
        quiet: true
