---
- name: Set release channel
  ansible.builtin.set_fact:
    _burpsuite_channel: "{{ 'Early Adopter' if burpsuite_early_adopter | bool else 'Stable' }}"

- name: Set platform
  ansible.builtin.set_fact:
    _burpsuite_platform: "{{ _burpsuite_platform_enum[ansible_facts['architecture']] }}"

- name: Get name of the user running the role
  ansible.builtin.command:
    cmd: id -un
  register: _burpsuite_user_name
  changed_when: false
  check_mode: false

- name: Get user details
  ansible.builtin.getent:
    database: passwd
    key: "{{ _burpsuite_user_name.stdout }}"

# getent passwd fields: password, uid, gid, gecos, home, shell
- name: Set user home
  ansible.builtin.set_fact:
    _burpsuite_user_home: "{{ ansible_facts['getent_passwd'][_burpsuite_user_name.stdout][4] }}"

- name: Set install directory and user config path
  ansible.builtin.set_fact:
    _burpsuite_install_dir: "{{ _burpsuite_user_home }}/BurpSuite"
    _burpsuite_user_config_path: "{{ _burpsuite_user_home }}/.BurpSuite/UserConfig.json"
